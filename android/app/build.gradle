plugins { id 'com.android.application' }

android {
    namespace 'org.dawnofkings.game'
    compileSdk 35
    buildToolsVersion '36.0.0'
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.dawnofkings.game'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_POLICY_VERSION_MINIMUM=3.5' }
        }
    }
    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }
    sourceSets {
        main { assets.srcDirs = ['../../assets'] }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError false }
}
